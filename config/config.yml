app:
  name: console
  repo: device-management-toolkit/console
  version: DEVELOPMENT
  encryption_key: ""
  allow_insecure_ciphers: false
http:
  host: localhost
  port: "8181"
  # set to true for WAN settings where bandwidth is a concern, false for LAN/low latency/high bandwidth
  ws_compression: false
  tls:
    enabled: true
    # If certFile/keyFile are both empty and enabled is true, a self-signed certificate will be generated at runtime.
    certFile: ""
    keyFile: ""
  # Origins allowed to make cross-origin calls and to open a redirection
  # (KVM/SOL/IDER) websocket. Add the origin the UI is served from if it is not
  # this server. Never use "*": it exposes every API response to any site, and
  # the relay refuses cross-origin handshakes while it is set.
  allowed_origins:
    - "https://localhost:8181"
    - "https://127.0.0.1:8181"
    - "http://localhost:8181"
    - "http://127.0.0.1:8181"
    # `ng serve` dev UI
    - "http://localhost:4200"
    - "https://localhost:4200"
    - "http://127.0.0.1:4200"
    - "https://127.0.0.1:4200"
  allowed_headers:
    - "Origin"
    - "Accept"
    - "Content-Type"
    - "Content-Length"
    - "Authorization"
    - "If-Match"
  # Lets a cross-origin UI send the HttpOnly session cookie. Forced off while
  # allowed_origins contains "*", as CORS forbids that combination.
  allow_credentials: true
logger:
  log_level: info
secrets: 
  address: http://localhost:8200
  token: ""
postgres:
  # provider selects the backend. Empty defaults to "sqlite".
  #   postgres -> hosted PostgreSQL; DB_URL must be set (postgres://...)
  #   sqlite   -> embedded SQLite under the user's config dir; DB_URL is ignored
  #   mongo    -> MongoDB; DB_URL must be set (mongodb://...)
  provider: sqlite
  pool_max: 2
  url: ""
ea:
  url: http://localhost:8000
  username: ""
  password: ""
auth:
  disabled: false
  adminUsername: standalone
  adminPassword: 
  jwtKey: your_secret_jwt_key
  jwtExpiration: 24h0m0s
  redirectionJWTExpiration: 5m0s
  clientId: ""
  issuer: ""
  ui: 
    clientId: ""
    issuer: ""
    scope: ""
    redirectUri: ""
    responseType: "code"
    requireHttps: false
    strictDiscoveryDocumentValidation: true
ui:
  # externalUrl: Only used when building with the 'noui' tag (headless builds)
  # - If set: Redirects UI requests to this external URL (e.g., separately hosted UI)
  # - If empty: UI requests return 404 (API-only mode)
  # - Ignored: When building without 'noui' tag (embedded UI is served normally)
  # Example: https://ui.example.com
  externalUrl: ""

