name: Trivy version maintenance

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Determine current and latest Trivy action versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          WORKFLOW=.github/workflows/trivy-scan.yml
          CURRENT_VERSION=$(grep -E 'aquasecurity/trivy-action.*#' "$WORKFLOW" | head -n 1 | sed -E 's/.*# ([0-9.]+).*/\1/' || true)
          LATEST_TAG=$(gh api repos/aquasecurity/trivy-action/releases/latest --jq '.tag_name' 2>/dev/null || true)

          if [ -z "$CURRENT_VERSION" ] || [ -z "$LATEST_TAG" ]; then
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_VERSION=${LATEST_TAG#v}
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "latest_version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"

          python3 - <<'PY'
import os
from packaging.version import Version

current = os.environ["CURRENT_VERSION"]
latest = os.environ["LATEST_VERSION"]
print(f"Current Trivy action version: {current}")
print(f"Latest Trivy action version: {latest}")
print(f"Needs update: {Version(latest) > Version(current)}")
with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
    fh.write(f"has_update={'true' if Version(latest) > Version(current) else 'false'}\n")
PY

      - name: Update workflow to latest Trivy action and remove workaround
        if: steps.versions.outputs.has_update == 'true'
        shell: bash
        run: |
          set -euo pipefail

          WORKFLOW=.github/workflows/trivy-scan.yml
          LATEST_TAG="v${{ steps.versions.outputs.latest_version }}"

          sed -i -E "s#uses: aquasecurity/trivy-action@.*#uses: aquasecurity/trivy-action@${LATEST_TAG}#" "$WORKFLOW"
          sed -i '/trivy-flags: "--skip-version-check"/d' "$WORKFLOW"
          git diff -- .github/workflows/trivy-scan.yml

      - name: Create PR for Trivy refresh
        if: steps.versions.outputs.has_update == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/trivy-version-refresh
          title: "chore: refresh Trivy action and remove version-check workaround"
          commit-message: "chore: refresh Trivy action and remove version-check workaround"
          body: |
            ## Summary
            This PR refreshes the pinned Trivy action to the latest release and removes the temporary `--skip-version-check` workaround once the newer action no longer triggers the false failure.

            ## Why
            Trivy was exiting nonzero because of the version-check warning rather than a real vulnerability finding.

            ## Notes
            - This PR is intended for automated merge after review.
            - The repo is already using Copilot code review, so this change is suitable for automated review and standard PR validation.
          delete-branch: true

      - name: Enable auto-merge for the maintenance PR
        if: steps.versions.outputs.has_update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh pr list --state open --head chore/trivy-version-refresh --json number --jq '.[0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            gh pr merge "$PR_NUMBER" --auto --squash --delete-branch
          fi
