<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Console password</title>
  <style>
    body { font: 16px system-ui, sans-serif; margin: 3rem auto; max-width: 32rem; padding: 0 1rem; }
    label { display: block; margin: 1rem 0 .35rem; }
    input { box-sizing: border-box; padding: .6rem; width: 100%; }
    button { margin-top: 1.25rem; padding: .65rem 1rem; }
    #status { min-height: 1.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>Change Console password</h1>
    <form id="password-form">
      <label for="current-password">Current password</label>
      <input id="current-password" name="currentPassword" type="password" autocomplete="current-password" required>
      <label for="new-password">New password</label>
      <input id="new-password" name="newPassword" type="password" autocomplete="new-password" required minlength="8">
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8">
      <button type="submit">Change password</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    const form = document.getElementById("password-form");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "Updating password...";

      const fields = new FormData(form);
      try {
        const response = await fetch("/api/v1/authorize/password", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            currentPassword: fields.get("currentPassword"),
            newPassword: fields.get("newPassword"),
            confirmPassword: fields.get("confirmPassword")
          })
        });
        const result = await response.json();
        status.textContent = response.ok
          ? "Password changed."
          : result.error || result.message || "Password could not be changed.";
        if (response.ok) form.reset();
      } catch {
        status.textContent = "Unable to contact Console. Check the connection and try again.";
      }
    });
  </script>
</body>
</html>
